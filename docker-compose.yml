services:
  repoharbor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repoharbor
    ports:
      - "8080:8080"
    environment:
      REPOHARBOR_ADDR: ":8080"
      REPOHARBOR_DATA_DIR: "/data"
      TZ: "Asia/Shanghai"
    volumes:
      - repoharbor_data:/data
    restart: unless-stopped

volumes:
  repoharbor_data:
